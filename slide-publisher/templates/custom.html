<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="generator" content="canva-slide-publisher" />
  <meta name="updated-at" content="{{GENERATED_AT}}" />
  <style>
    /* ── Customize this template to match your brand ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .slide {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .slide img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  {{SLIDES}}

  <script>
    // Auto-refresh on update
    (function() {
      var lastUpdate = "{{GENERATED_AT}}";
      setInterval(function() {
        fetch(window.location.href, { cache: "no-store" })
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var m = html.match(/name="updated-at"\s+content="([^"]+)"/);
            if (m && m[1] !== lastUpdate) window.location.reload();
          }).catch(function() {});
      }, 30000);
    })();
  </script>
</body>
</html>
